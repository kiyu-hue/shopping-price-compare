name: Windows portable app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller playwright
      - name: Build portable EXE with browser
        run: python build_win_bundle.py
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: shopping-price-compare-windows
          path: dist/가격비교기/
